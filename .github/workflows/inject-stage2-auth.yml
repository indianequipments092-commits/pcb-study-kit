name: Repair Stage 2 Auth Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair script placement
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="stage2-auth.js"></script>'

          # Remove every old auth tag first. The PDF exporter contains HTML
          # inside a JavaScript string, so a literal </script> there breaks
          # the browser's parsing of the main application script.
          s = s.replace(tag, '')

          body = '</body>'
          if body not in s:
              raise SystemExit('No </body> marker found')

          # Only the final document body is the real HTML body marker.
          before, after = s.rsplit(body, 1)
          s = before + tag + '\n' + body + after
          p.write_text(s, encoding='utf-8')

          if s.count(tag) != 1:
              raise SystemExit('Expected exactly one auth tag')
          tag_pos = s.find(tag)
          main_close_before_tag = s.rfind('</script>', 0, tag_pos)
          if main_close_before_tag < 0:
              raise SystemExit('Main application script closing tag not found')
          print('Auth tag repaired after the main application script.')

      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          tag = '<script src="stage2-auth.js"></script>'
          if s.count(tag) != 1:
              raise SystemExit('Auth tag count is not 1')
          tag_pos = s.find(tag)
          main_close_before_tag = s.rfind('</script>', 0, tag_pos)
          if main_close_before_tag < 0 or tag_pos <= main_close_before_tag:
              raise SystemExit('Auth tag placement is invalid')
          if not Path('stage2-auth.js').read_text(encoding='utf-8').strip():
              raise SystemExit('stage2-auth.js is empty')
          print('Stage 2 integration verification passed.')

      - name: Cleanup temporary files
        shell: bash
        run: rm -f _diagnostic.txt _diagnostic2.txt _diagnostic3.txt _diagnostic4.txt _stage2_fix_trigger.txt

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html _diagnostic.txt _diagnostic2.txt _diagnostic3.txt _diagnostic4.txt _stage2_fix_trigger.txt; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _diagnostic.txt _diagnostic2.txt _diagnostic3.txt _diagnostic4.txt _stage2_fix_trigger.txt
          git commit -m "Repair Stage 2 script placement"
          git push
