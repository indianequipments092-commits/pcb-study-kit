name: Finalize auth UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize auth navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PCB_FINAL_AUTH_UI_V5 -->'
          if marker not in s:
              patch=r'''<!-- PCB_FINAL_AUTH_UI_V5 -->
          <script>
          (function(){
            const U='https://xmubirikizzdsikkfnej.supabase.co',K='sb_publishable_K8jIPdbFDB8nWkwSABqv9g_qM5_cS4d';
            function run(){
              if(!window.supabase?.createClient)return setTimeout(run,250);
              const c=window.supabase.createClient(U,K);
              const hideOld=()=>{document.getElementById('pcb-stage2-auth')?.classList.remove('show');document.querySelectorAll('.pcb-personal-addon,.pcb-auth-account').forEach(x=>x.classList.remove('show'))};
              const showOld=()=>{document.getElementById('pcb-stage2-auth')?.classList.add('show');document.querySelectorAll('.pcb-personal-addon,.pcb-auth-account').forEach(x=>x.classList.remove('show'))};
              const sync=async(session)=>{if(session?.user)hideOld();else showOld()};
              c.auth.onAuthStateChange((e,s)=>setTimeout(()=>sync(s),0));
              c.auth.getSession().then(({data})=>sync(data.session));
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/final-auth-ui-fix.yml || true
          git commit -m "Finalize login page transition" || exit 0
          git push
