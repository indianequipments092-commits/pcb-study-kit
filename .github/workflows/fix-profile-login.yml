name: Fix OTP profile login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile race during OTP login
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  const enter=async(session)=>{\n    clearMsg();\n    const {data:profile,error}=await client.from('profiles').select('full_name,email,role,status,student_id,sub_admin_id').eq('id',session.user.id).single();\n    if(error||!profile){await client.auth.signOut();showMsg('Account profile is not ready yet. Please complete registration/verification and try again.');return;}\n    if(profile.status!=='active'){await client.auth.signOut();showMsg('This account is currently '+profile.status+'. Please contact the administrator.');return;}\n    const id=profile.role==='student'?profile.student_id:(profile.role==='sub_admin'?profile.sub_admin_id:'MAIN');\n    document.getElementById('pcb-account-text').textContent=(profile.full_name||session.user.email)+' · '+profile.role.replace('_',' ').toUpperCase()+' · '+id;\n    account.classList.add('show');gate.classList.remove('show');\n  };'''
          new = '''  let entering=false;\n  const enter=async(session)=>{\n    if(!session||entering)return;\n    entering=true;\n    try{\n      clearMsg();\n      let profile=null,error=null;\n      for(let attempt=0;attempt<6;attempt++){\n        const r=await client.from('profiles').select('full_name,email,role,status,student_id,sub_admin_id').eq('id',session.user.id).maybeSingle();\n        profile=r.data; error=r.error;\n        if(profile)break;\n        if(attempt<5)await new Promise(resolve=>setTimeout(resolve,350));\n      }\n      if(error||!profile){await client.auth.signOut();showMsg('Account profile is not ready yet. Please complete registration/verification and try again.');return;}\n      if(profile.status!=='active'){await client.auth.signOut();showMsg('This account is currently '+profile.status+'. Please contact the administrator.');return;}\n      const id=profile.role==='student'?profile.student_id:(profile.role==='sub_admin'?profile.sub_admin_id:'MAIN');\n      document.getElementById('pcb-account-text').textContent=(profile.full_name||session.user.email)+' · '+profile.role.replace('_',' ').toUpperCase()+' · '+id;\n      account.classList.add('show');gate.classList.remove('show');\n    }finally{entering=false;}\n  };'''
          if old not in s:
              raise SystemExit('Expected auth enter block was not found; no changes made.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-profile-login.yml
          git add index.html .github/workflows/fix-profile-login.yml
          git commit -m "Fix OTP profile loading race [skip ci]"
          git push
