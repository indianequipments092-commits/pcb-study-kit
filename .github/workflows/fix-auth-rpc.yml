name: Fix PCB auth profile access
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth profile lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  let entering=false;
  const enter=async(session)=>{
    if(!session||entering)return;
    entering=true;
    try{
      clearMsg();
      let profile=null,error=null;
      for(let attempt=0;attempt<6;attempt++){
        const r=await client.from('profiles').select('full_name,email,role,status,student_id,sub_admin_id').eq('id',session.user.id).maybeSingle();
        profile=r.data; error=r.error;
        if(profile)break;
        if(attempt<5)await new Promise(resolve=>setTimeout(resolve,350));
      }
      if(error||!profile){await client.auth.signOut();showMsg('Account profile is not ready yet. Please complete registration/verification and try again.');return;}
      if(profile.status!=='active'){await client.auth.signOut();showMsg('This account is currently '+profile.status+'. Please contact the administrator.');return;}
      const id=profile.role==='student'?profile.student_id:(profile.role==='sub_admin'?profile.sub_admin_id:'MAIN');
      document.getElementById('pcb-account-text').textContent=(profile.full_name||session.user.email)+' · '+profile.role.replace('_',' ').toUpperCase()+' · '+id;
      account.classList.add('show');gate.classList.remove('show');
    }finally{entering=false;}
  };"""
          new="""  let entering=false;
  const enter=async(session)=>{
    if(!session||entering)return;
    entering=true;
    try{
      clearMsg();
      let profile=null,error=null;
      for(let attempt=0;attempt<8;attempt++){
        const current=(await client.auth.getSession()).data.session||session;
        const r=await client.rpc('get_my_profile');
        profile=Array.isArray(r.data)?(r.data[0]||null):r.data;
        error=r.error;
        if(profile)break;
        if(attempt<7)await new Promise(resolve=>setTimeout(resolve,500));
      }
      if(error){await client.auth.signOut();showMsg('Could not load your account profile. Please try again.');return;}
      if(!profile){await client.auth.signOut();showMsg('Account profile is not ready yet. Please complete registration/verification and try again.');return;}
      if(profile.status!=='active'){await client.auth.signOut();showMsg('This account is currently '+profile.status+'. Please contact the administrator.');return;}
      const current=(await client.auth.getSession()).data.session||session;
      const id=profile.role==='student'?profile.student_id:(profile.role==='sub_admin'?profile.sub_admin_id:'MAIN');
      document.getElementById('pcb-account-text').textContent=(profile.full_name||current.user.email)+' · '+profile.role.replace('_',' ').toUpperCase()+' · '+id;
      account.classList.add('show');gate.classList.remove('show');
    }finally{entering=false;}
  };"""
          if old not in s: raise SystemExit('expected enter block not found')
          s=s.replace(old,new,1)
          old_admin="""  document.getElementById('pcb-admin-form').onsubmit=async(e)=>{e.preventDefault();clearMsg();const btn=e.submitter;btn.disabled=true;const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('pcb-admin-email').value.trim().toLowerCase(),password:document.getElementById('pcb-admin-password').value});btn.disabled=false;if(error){showMsg(error.message);return;}const {data:p,error:pe}=await client.from('profiles').select('role,status').eq('id',data.user.id).single();if(pe||!p||!['main_admin','sub_admin'].includes(p.role)){await client.auth.signOut();showMsg('This account is not an administrator.');return;}if(p.status!=='active'){await client.auth.signOut();showMsg('Administrator account is not active.');}};"""
          new_admin="""  document.getElementById('pcb-admin-form').onsubmit=async(e)=>{e.preventDefault();clearMsg();const btn=e.submitter;btn.disabled=true;const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('pcb-admin-email').value.trim().toLowerCase(),password:document.getElementById('pcb-admin-password').value});btn.disabled=false;if(error){showMsg(error.message);return;}const {data:rows,error:pe}=await client.rpc('get_my_profile');const p=Array.isArray(rows)?(rows[0]||null):rows;if(pe||!p){await client.auth.signOut();showMsg('Administrator profile is not configured for this account.');return;}if(!['main_admin','sub_admin'].includes(p.role)){await client.auth.signOut();showMsg('This account is a student account, not an administrator.');return;}if(p.status!=='active'){await client.auth.signOut();showMsg('Administrator account is not active.');return;}await enter(data.session);};"""
          if old_admin not in s: raise SystemExit('expected admin block not found')
          s=s.replace(old_admin,new_admin,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-auth-rpc.yml
          git add index.html .github/workflows/fix-auth-rpc.yml
          git commit -m "Fix auth profile lookup with secure RPC [skip ci]"
          git push
