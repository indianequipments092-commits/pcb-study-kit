name: temporary-auth-ui-patch2
on:
  push:
    paths:
      - '.auth-ui-trigger-2'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); marker='<!-- AUTH_UI_PATCH2 -->'; p.write_text(s if marker in s else s.replace('</body>', marker+'</body>'))"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Test auth UI patch workflow' || exit 0
          git push
