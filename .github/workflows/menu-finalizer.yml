name: Wire premium menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PCB_MENU_WIRING_V7 -->'
          if marker not in s:
              patch='''<!-- PCB_MENU_WIRING_V7 --><script>(function(){function boot(){if(document.getElementById('pcbV7Bar'))return;var b=document.createElement('div');b.id='pcbV7Bar';b.innerHTML='<span id="pcbV7Name">PCB Study Kit</span><button id="pcbV7Btn">⋮</button>';var st=document.createElement('style');st.textContent='#pcbV7Bar{display:none;position:fixed;top:12px;right:14px;z-index:1400;align-items:center;gap:8px;padding:6px 7px 6px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(10,15,30,.84);backdrop-filter:blur(22px);box-shadow:0 16px 45px rgba(0,0,0,.28)}#pcbV7Bar.show{display:flex}#pcbV7Name{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:850;color:var(--text)}#pcbV7Btn{width:40px;height:40px;padding:0;border-radius:13px;background:rgba(148,163,184,.10);border:1px solid var(--line);color:var(--text);font-size:23px}#pcbV7Menu{display:none;position:fixed;top:64px;right:14px;z-index:1401;width:min(280px,calc(100vw - 28px));padding:8px;border:1px solid var(--line);border-radius:20px;background:var(--card2);box-shadow:0 28px 75px rgba(0,0,0,.45)}#pcbV7Menu.show{display:block}.pcbV7Item{width:100%;padding:12px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--text);text-align:left;font-size:12px;font-weight:850}.pcbV7Item:hover{transform:none;background:rgba(124,92,255,.08);border-color:rgba(124,92,255,.16)}';document.head.appendChild(st);document.body.appendChild(b);var m=document.createElement('div');m.id='pcbV7Menu';m.innerHTML='<button class="pcbV7Item" data-x="home">⌂ &nbsp; Home page</button><button class="pcbV7Item" data-x="personal">👤 &nbsp; Personal Detail</button><button class="pcbV7Item" data-x="about">ⓘ &nbsp; About</button><button class="pcbV7Item" data-x="settings">⚙ &nbsp; Setting</button><button class="pcbV7Item" data-x="logout">↪ &nbsp; Logout</button>';document.body.appendChild(m);var gate=document.getElementById('pcb-stage2-auth');function state(){var inApp=gate&&!gate.classList.contains('show');b.classList.toggle('show',!!inApp);document.querySelectorAll('.pcb-personal-addon,.pcb-auth-account').forEach(function(x){x.classList.remove('show')});if(!inApp)m.classList.remove('show')}if(gate)new MutationObserver(state).observe(gate,{attributes:true,attributeFilter:['class']});setTimeout(state,500);b.querySelector('#pcbV7Btn').onclick=function(e){e.stopPropagation();m.classList.toggle('show')};m.querySelector('[data-x="home"]').onclick=function(){m.classList.remove('show');if(typeof goHome==='function')goHome();else window.scrollTo({top:0,behavior:'smooth'})};m.querySelector('[data-x="personal"]').onclick=function(){m.classList.remove('show');var x=document.querySelector('.pcb-personal-addon button');if(x)x.click();else if(window.PCBAuthFix&&PCBAuthFix.personal)PCBAuthFix.personal()};m.querySelector('[data-x="about"]').onclick=function(){m.classList.remove('show');alert('PCB Study Kit\\nPhysics • Chemistry • Biology\\nStudy, practice and progress in one workspace.')};m.querySelector('[data-x="settings"]').onclick=function(){m.classList.remove('show');if(typeof toggleTheme==='function')toggleTheme();};m.querySelector('[data-x="logout"]').onclick=function(){m.classList.remove('show');var x=document.querySelector('.pcb-personal-addon button:last-child');if(x)x.click();else if(window.PCBAuthFix&&PCBAuthFix.logout)PCBAuthFix.logout()};document.addEventListener('click',function(e){if(!m.contains(e.target)&&e.target!==b.querySelector('#pcbV7Btn'))m.classList.remove('show')})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()})();</script>'''
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/menu-finalizer.yml || true
          git commit -m "Wire premium three-dot account menu" || exit 0
          git push
